<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bass performance study</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f5f3ee}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { createCharacter } from '../src/room/art/character.ts';
import { createBassGarden } from '../src/room/art/bassGarden.ts';
const params = new URLSearchParams(location.search);
const pose = await import('../src/room/art/bassPose.ts');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1; renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#f5f3ee');
scene.add(new THREE.HemisphereLight('#fffaf4','#8c857a',2.1));
const key=new THREE.DirectionalLight('#fff5e9',2.4);key.position.set(-3,5,-4);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-1.2,right:1.2,top:1.5,bottom:-.5,near:.1,far:12});
key.shadow.bias=-.0002;key.shadow.normalBias=.004;scene.add(key);
const fill=new THREE.DirectionalLight('#e5e9f2',.8);fill.position.set(4,2,3);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({opacity:.12}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const character=createCharacter(); scene.add(character.group);
const garden=createBassGarden(); scene.add(garden.instrument);
const camera=new THREE.OrthographicCamera(-.78*innerWidth/innerHeight,.78*innerWidth/innerHeight,.78,-.78,.01,30);
const views={front:0,quarter:-45,side:-90,rear:-135,back:180,other:90};
const angle=(views[params.get('view')||'quarter']??-45)*Math.PI/180;
camera.position.set(Math.sin(angle)*4,.85,-Math.cos(angle)*4);camera.lookAt(0,.6,-.05);
const scale=new THREE.Vector3();
function renderPose(beat=Number(params.get('beat')||0),string=Number(params.get('string')||3),fret=Number(params.get('fret')||3),pluck=Number(params.get('pluck')||0), draw=true) {
  character.animate({time:beat*.625,speed:0,grounded:true,velocityY:0,punchProgress:null,reducedMotion:false,
    bass:{lift:1,playing:true,beat,string,fret,fretting:true,pluckString:string,pluck}});
  character.bassAnchor.updateWorldMatrix(true,false);
  garden.instrument.position.copy(pose.BASS_HELD_POSITION).applyMatrix4(character.bassAnchor.matrixWorld);
  character.bassAnchor.getWorldQuaternion(garden.instrument.quaternion).multiply(pose.BASS_HELD_ROTATION);
  character.bassAnchor.getWorldScale(scale).multiplyScalar(pose.BASS_HELD_SCALE);garden.instrument.scale.copy(scale);
  scene.updateMatrixWorld(true);if(draw)renderer.render(scene,camera);
}
// Let smooth hand positioning settle before a fixed pose is compared.
for(let i=0;i<30;i++) renderPose(undefined,undefined,undefined,undefined,false);
renderPose();
document.body.dataset.ready='true';
window.bassStudy={renderer,scene,camera,character,garden,renderPose};
addEventListener('pagehide',()=>{character.dispose();garden.dispose();ground.geometry.dispose();ground.material.dispose();renderer.dispose()});
</script></body></html>

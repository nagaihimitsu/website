<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character geometry study</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fafafa;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // Development-only comparison rig. It imports the same model as the room
      // and is not an entry point of the production build.
      import * as THREE from "three";
      import { createCharacter } from "../src/room/art/character.ts";
      const params = new URLSearchParams(location.search);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#fafafa");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      document.body.append(renderer.domElement);
      scene.add(new THREE.HemisphereLight("#fffaf4", "#8c857a", 2.1));
      const light = new THREE.DirectionalLight("#fff5e9", 1.8);
      light.position.set(-3, 5, -4);
      light.castShadow = true;
      light.shadow.mapSize.set(2048, 2048);
      Object.assign(light.shadow.camera, {
        left: -1.1,
        right: 1.1,
        top: 1.5,
        bottom: -0.4,
        near: 0.1,
        far: 12,
      });
      light.shadow.bias = -0.0002;
      light.shadow.normalBias = 0.004;
      light.shadow.radius = 4;
      scene.add(light);
      const softboxFill = new THREE.DirectionalLight("#fff5e9", 1.1);
      softboxFill.position.set(-1, 3, -5);
      scene.add(softboxFill);
      const fill = new THREE.DirectionalLight("#e5e9f2", 0.65);
      fill.position.set(4, 2, 3);
      scene.add(fill);
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.ShadowMaterial({ opacity: 0.12 }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);
      const character = createCharacter();
      scene.add(character.group);
      character.animate({
        time: 0,
        speed: 0,
        grounded: true,
        velocityY: 0,
        punchProgress: null,
        reducedMotion: true,
      });
      // Compare adjacent angles as well as the profile: a reference's projected
      // proportions must not be mistaken for differences in the actual sculpt.
      const views = {
        front: 0,
        quarter: -45,
        shallow: -35,
        profile: -60,
        side: 90,
        back: 180,
      };
      const angle =
        ((views[params.get("view") || "quarter"] ?? -45) * Math.PI) / 180;
      const faceStudy = params.get("focus") === "face";
      const height = faceStudy ? 0.66 : 1.38;
      const width = (height * innerWidth) / innerHeight;
      const camera = new THREE.OrthographicCamera(
        -width / 2,
        width / 2,
        height / 2,
        -height / 2,
        0.01,
        30,
      );
      const targetY = faceStudy ? 0.95 : 0.62;
      camera.position.set(Math.sin(angle) * 4, targetY + (faceStudy ? 0.15 : 0.31), -Math.cos(angle) * 4);
      camera.lookAt(0, targetY, 0);
      renderer.render(scene, camera);
      document.body.dataset.ready = "true";
      window.characterStudy = { renderer, camera, scene, character };
      addEventListener("pagehide", () => {
        character.dispose();
        renderer.dispose();
      });
    </script>
  </body>
</html>

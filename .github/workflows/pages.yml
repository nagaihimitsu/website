name: Publish Personal Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation:
        description: "Validation scope: visual, links, movement, NPC, records, room/refactor or full"
        type: choice
        required: true
        default: full
        options: [full, visual, links, movement, records, npc, room, refactor]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate selected scope
        env:
          # Pushes retain the full suite; manual runs use the same scopes as local work.
          VALIDATION_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation || 'full' }}
        run: npm run test:scope -- "$VALIDATION_SCOPE"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

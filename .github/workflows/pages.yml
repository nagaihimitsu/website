name: Publish Personal Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation:
        description: "変更範囲に必要な検証。buildはビルドのみ、fullは共有基盤などの全体検証用"
        type: choice
        required: true
        default: build
        options: [build, world-regions, world, visual, links, movement, records, npc, outdoors, music, room, refactor, full]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    # 検証は最新コミットを優先し、公開ジョブの完了を妨げない。
    concurrency:
      group: atlas-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      # 変更箇所のテストはローカルまたは手動で範囲指定し、通常pushでは重複実行しない。
      VALIDATION_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation || 'build' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: env.VALIDATION_SCOPE != 'build'
        run: npx playwright install --with-deps chromium
      - name: Validate selected scope
        if: env.VALIDATION_SCOPE != 'build'
        run: npm run test:scope -- "$VALIDATION_SCOPE"
      - if: env.VALIDATION_SCOPE == 'world' || env.VALIDATION_SCOPE == 'full'
        run: npx playwright install --with-deps webkit
      - name: Validate WORLD layout in WebKit
        if: env.VALIDATION_SCOPE == 'world' || env.VALIDATION_SCOPE == 'full'
        run: npx playwright test --config playwright.world-webkit.config.ts
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
